<title>Ordexa Fulfillment Website</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#070D17;--fg:#E6EDF5;--muted:#93A4B8;--line:rgba(94,224,255,.22);--or:#F59421;--cy:#5ee0ff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background-image:radial-gradient(800px 500px at 20% 0,rgba(29,108,166,.35),transparent 65%),radial-gradient(600px 400px at 90% 100%,rgba(245,148,33,.1),transparent 65%)}
main{width:min(560px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px;padding:48px 32px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,#112340,#0b1a30);box-shadow:0 60px 100px -50px #000}
img{width:300px;max-width:80vw;height:auto}
h1{font:800 clamp(26px,5vw,34px)/1.15 Montserrat,Inter,sans-serif;letter-spacing:-.03em}
p{color:var(--muted);max-width:42ch}
.go{display:inline-flex;background:var(--or);color:#101828;font-weight:700;text-decoration:none;padding:15px 30px;border-radius:999px;box-shadow:0 10px 40px -8px rgba(245,148,33,.7)}
.go:focus-visible,.l a:focus-visible{outline:2px solid var(--or);outline-offset:3px}
.l{display:flex;gap:10px}.l a{color:var(--cy);text-decoration:none;font:500 13px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.1em;padding:8px 16px;border:1px solid var(--line);border-radius:999px}.l a:hover{background:rgba(94,224,255,.08)}
.n{font-size:13px}
</style>
<main>
  <img src="assets/logo-t.png" alt="Ordexa Fulfillment" width="300" height="56">
  <h1>The new Ordexa website</h1>
  <p>Home, Services, Platform, Coverage, How it works and Get Started, in English, French and Arabic.</p>
  <a class="go" href="site/index.html">Open the site</a>
  <div class="l"><a href="site/index.html">EN</a><a href="site/fr/index.html">FR</a><a href="site/ar/index.html" lang="ar">عربي</a></div>
  <p class="n">If a link does not open inside this view, open this artifact's address in its own browser tab.</p>
</main>
